apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "openshift-console-plugin.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
data:
  custom.conf: |
    server {
      listen              {{ .Values.plugin.port }} ssl;
      listen              [::]:{{ .Values.plugin.port }} ssl;
      ssl_certificate     /var/cert/tls.crt;
      ssl_certificate_key /var/cert/tls.key;
      root                /usr/share/nginx/html;

      location = /plugin-manifest.json {
        sub_filter_types *;
        sub_filter '__CAPSULE_SECTION_NAME__' '{{ .Values.plugin.sectionName }}';
        sub_filter_once on;
      }
    }
