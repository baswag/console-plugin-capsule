apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "openshift-console-plugin.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
data:
  # Read by the plugin at runtime to discover the addons mounted below addons/.
  addons-index.json: {{ include "openshift-console-plugin.addonsIndex" . | quote }}
  custom.conf: |
    server {
      listen              {{ .Values.plugin.port }} ssl;
      listen              [::]:{{ .Values.plugin.port }} ssl;
      ssl_certificate     /var/cert/tls.crt;
      ssl_certificate_key /var/cert/tls.key;
      root                /usr/share/nginx/html;

      # console-extensions.json declares the nav section name as the literal placeholder
      # __CAPSULE_SECTION_NAME__ so it can be set per-deployment via plugin.sectionName.
      # This bypasses the plugin's i18n system on purpose: a Helm-configured value isn't
      # available at build time, so it can't be expressed as a "%plugin__ns~key%" i18n
      # reference. The substituted text is shown as-is in every locale.
      location = /plugin-manifest.json {
        sub_filter_types *;
        sub_filter '__CAPSULE_SECTION_NAME__' '{{ .Values.plugin.sectionName }}';
        sub_filter_once on;
      }

      # Addons are mounted from volumes and can change without a new image, so browsers
      # must revalidate instead of caching them.
      location /addons/ {
        add_header Cache-Control "no-cache" always;
      }
    }
